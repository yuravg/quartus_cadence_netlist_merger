[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quartus_cadence_netlist_merger"
version = "2.0.0"
description = "CLI to merge Quartus pin and Cadence Allegro net-list"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Yuriy VG", email = "yuravg@gmail.com"}
]
keywords = ["quartus", "cadence", "allegro", "netlist", "merger", "fpga", "pcb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Embedded Systems",
]

[project.urls]
"Homepage" = "https://github.com/yuravg/quartus_cadence_netlist_merger"

# Optional development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "build>=1.0",
    "wheel",
    "mypy>=1.8",
    "ruff>=0.1",
    "black>=24.0",
]

# This creates an executable command called 'qp_cnl_merger'
# that calls the main() function in quartus_cadence_netlist_merger module
[project.scripts]
qp_cnl_merger = "quartus_cadence_netlist_merger.main:main"

# Setuptools-specific configuration
[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["quartus_cadence_netlist_merger*"]

# Pytest configuration
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for component interactions",
    "regression: Regression tests against reference netlists",
    "real_data: Integration tests using real test data files",
    "slow: Tests that take longer to execute",
]
# Minimum Python version for testing
minversion = "4.6"

# Coverage configuration
[tool.coverage.run]
source = ["quartus_cadence_netlist_merger"]
omit = [
    "*/tests/*",
    "*/test/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if 0:",
    "if False:",
]

[tool.coverage.html]
directory = "htmlcov"

# Test count validation (prevents accidental test removal)
[tool.quartus_cadence_netlist_merger.testing]
expected_test_count = 47

# Mypy type checking configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start with false, gradually enable
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true

# Ruff linter configuration
[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by black)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["F401", "F811"]  # Allow test-specific patterns

# Black code formatter configuration
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''
